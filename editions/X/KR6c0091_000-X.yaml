body:
  text: 序從古聖人之書皆所以垂教也而統智愚聖凡胎卵溼化而胥度之者莫如金剛經是經也以無念為宗以離相為旨以斷除貪妄為功夫以清淨涅槃為究竟誠昏衢之巨燭苦海之慈航也自西域傳人中華上自王候紳士下迄牧豎樵夫靡不家置一編頂禮而供奉之較四書六經倍加尊重然雖明衣潔裳淨體端容敲碎木魚而口之所誦非心之所知目之所暗非意之所會如入暗室不見一物如遊蠻莫辨何言亦安能起大堅固生大智慧而臻無上菩提之岸哉門下士黃子正元閩總戎號泰一憫世人但誦經文不曉經義請直解於予予瞿然曰此經為我佛之傳燈微妙祕密予何人斯敢以蠡測之見妄語高深哉黃子請甚力不獲辭因節取昔賢之論而增損之謬參己見而串合之前載註語既字詮而句釋後列講旨復縷晰而條分或過遞下卷不凌不躐或迴顧上意不漏不遺務使口吻順適脈絡貫通俾誦者對其文曉其義如親歷祇樹園中見佛與空生娓娓問答向之在暗室者處處開明向之遊蠻者言言盡解亦一大快事也葢佛書談空儒書言實解佛之書以解儒書者解之則理順訶通後學之人一見了然易於遵循若於經中之章節問答起伏聯貫處概置不講而多引棒喝堂參之語以作訓詁如鏡中華探之不得如水中月捉之不能揆之我佛傳經之心斷不如是茲刻壽世必有尋文究義而得阿耨多羅三藐三菩提者黃子之功將與佛土並永豈特勝於三千大千世界七寶以用布施者哉旹大清乾隆元年律次夾鐘之月純陽子沐手敬序夫斯經者乃大雄氏之準繩昔孔聖之大易老子之道清斯三者竊陰陽之造化奪宇宙之精華誠雨粟夜哭之再發明也故其後略門牆者無不以奉此三者為尺璧寸珠之奇珍焉然而履其國歷其階雖千萬人無一往矣其孔老之教一以理數匡時為萬世之木鐸一以修真度眾作九轉之金鍼惟佛氏之書皆以莊嚴借喻空寂傳宗自有為而徹無為因四相而參滅相其意奧其旨玄欲求洞其一班者解矣雖有昭明之縷分純陽之箋釋自六朝以至今日紛紛解晰不已千百餘家各了各乘之奧妙其不能特贈與人也不過按圖索驥究其省識則廬山面目失其本真矣但其不可思議之碩果定不以異語謊後學人也努志者貴堅修持誦何必以窮章徹句摘底搜源作禪門之苦惱乎奚不悟如如不動一旦慧覺而不知焉故非法非非法即可以識西來意之本源者也旹道光辛丑年仲春月定光佛降筆於西江芝陽同善堂何須遠慕見蓮臺但把菩提心地栽悟得真空無一物此身便是活如來金剛經啟請若有人受持金剛經者先須至心念淨口業真言然後啟請八金剛四菩薩名號所在之處常常擁護淨口業真言脩利脩利摩訶脩利脩脩利薩婆訶淨三業真言唵娑音梭嚩音娃婆嚩秫音述䭾娑嚩達摩婆嚩婆嚩秫度音陀憾音酣安土地真言南無三滿多母音䭾音陀喃唵度嚕度嚕地音寨尾薩婆訶普供養真言唵誐音耶誐曩囊上聲三婆嚩韈音娃日音子囉音楋斛音吽奉請南無青除灾金剛除一切眾生宿世災殃主大海南無辟毒金剛除一切眾生瘟毒病患主災毒南無黃隨求金剛令一切眾生所求如願主功德南無白淨水金剛除一切眾生熟惱苦主一切寶南無赤聲火金剛除一切眾生無明見主生風南無定持灾金剛除一切眾生灾難苦主琉璃南無紫賢金剛令一切眾生開解悟主堅牢南無大神金剛令一切眾生智芽成就主龍奉請南無金剛眷菩薩慈也南無金剛索菩薩悲也南無金剛愛菩薩喜也南無金剛語菩薩捨也發願文稽首三界尊皈依十方佛我今發宏願持此金剛經上報四重恩下濟三途苦若有見聞者悉發菩提心盡此一報身同生極樂國云何梵云何得長壽金剛不壞身復以何因緣得大堅固力云何於此經究竟到彼岸願佛開微密廣為眾生說開經偈無上甚深微妙法百千萬劫難遭遇我今見聞得受持願解如來真實義
