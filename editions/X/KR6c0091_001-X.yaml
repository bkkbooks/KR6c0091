body:
  text: 孚佑帝君註解後學培真道人校正金剛般若波羅蜜經般若音鉢惹下倣此註金剛金中之剛利而能斷之意般若智慧也波羅蜜到彼岸也即諸佛菩薩超脫究竟之地經徑也言此經為修行之徑路也石天基註凡係如來語句用圈須菩提語句用黑圈阿難結集語用尖圈問答起語用連點點語句分明便於初學法會因由分第一說法聚會由此起因如是我聞一時佛在舍衛國祇樹給孤獨園與大比邱眾千二百五十人俱爾時世尊食時著衣持鉢入舍衛大城乞食於其城中次第乞已還至本處飯食訖收衣鉢洗足已敷座而坐著音酌鉢音撥飯食音反四註如是指全經而言我阿難自稱也言此經之所云乃我親聞於佛者也佛教主之稱舍衛國波斯匿王所居樹為匿王太子祇陀手種故曰祇樹給孤獨名須達拏樂善好施人皆稱為給孤獨長者須達深重佛教向祇陀借園建精舍用黃金布地請佛說法故佛常住園中比邱乞士也上乞法於諸佛菩薩下乞食於善信之謂世尊佛號也三界共仰之意敷排布也講阿難說我向者嘗聞我佛如來在舍衛國祇樹給孤獨長者園中座下乞士共一千二百五十人時方正午當進食之際佛乃著和柔忍辱之衣持四天王所獻之鉢率諸大眾於舍衛城中乞食不越貧而從富不捨賤而後貴平等無相次第乞已還至園中飯食訖收衣鉢洗足畢排布高座而坐焉善現啟請分第二善現長老啟請佛訓時長老須菩提在大眾中即從坐起偏袒右肩右膝著地合掌恭敬而白佛言希有世尊如來善護念諸菩薩善付囑諸菩薩世尊善男子善女人發阿耨多羅三藐三菩提心云何應住云何降伏其心佛言善哉善哉須菩提如汝所說如來善護念諸菩薩善付囑諸菩薩汝今諦聽當為汝說善男子善女人發阿耨多羅三藐三菩提心應如是住如是降伏其心唯然世尊願樂欲聞樂音要註長老年高有德之稱梵語須菩提華言善現一名空生左為邪道右為正道故偏袒右肩右膝著地合掌心合於道道合於心也白啟也希少也希有世尊先嘆其少有又呼佛號也下倣此如來佛之通稱謂真性自如隨所來而現也菩覺也薩情也義理先具能覺一切有情之意阿無也耨多羅上也三正也藐等也三菩提正覺也云何應住者言此心當住於何處諦詳審也唯然既諾而復是其言也講當佛敷座而坐之時有長老名須菩提者於大眾中從座而起袒其右肩屈其右膝合掌恭敬白佛言曰希有哉世尊座下諸菩薩有一千二百五十人不為不多倘如來不護持眷念俾信受是法則外誘得以擾亂之矣不付委囑託俾奉行是法則宗傳有時而斷絕矣但真性雖人同具而妄念未易消除三千大千之內若有善男子善女人發無上正等正覺之心者此心當住於何處方得降伏其妄念乎佛曰善哉善哉須菩提汝云如來善教諸菩薩此言深合我心汝其詳審靜聽當為汝說除妄之道世間若有善男子善女人發無上正等正覺之心者當絕去外緣一塵不染念念常住清淨則能自見其性而降伏其心矣維時須菩提心開意解曰唯曰然曰世尊曰願樂欲聞極致其傾會而讚歎焉大乘正宗分第三最大之乘至正之宗佛告須菩提諸菩薩摩訶薩應如是降伏其心所有一切眾生之類若卵生若胎生若溼生若化生若有色若無色若有想若無想若非有想非無想我皆令入無餘涅槃而滅度之如是滅度無量無數無邊眾生實無眾生得滅度者何以故須菩提若菩薩有我相人相眾生相壽者相即非菩薩涅槃音扛盤註摩訶薩梵語也即華言心體廣大不可測量之意卵生禽鳥也胎生人與獸也溼生水中鱗甲也化生蠅蚊等類也有色謂但有色聲而無情欲也無色謂但有靈識而無色身也有想方寸之中尚有計慮也無想靜涵萬有一念不動也非有想非無想雖一念不動不似木石之無知也後五者皆天上之人無餘此外無餘也涅不生也槃不死也滅度者滅盡一切諸相而度化之也講須菩提聞佛所說心意開解佛於是復告之曰須菩提諸菩薩性量廣大應如是降伏其心固已然我之心即人物之心所有一切眾生之類若世間之卵生胎生溼生化生天上之有色無色有想無想非有想非無想雖品類不同見地各異我皆令其不生不死消滅其種種諸相而度化之使之亦如是降伏其心焉如是無盡量無數目無邊界之眾生悉皆滅度亦眾生之自滅自度於我何功哉所以者何葢眾生之滅度若歸功於我則此心便有所著而不免於四相之累矣如心著於貪一邊則為己計私而有我相心著於瞋一邊則分別爾汝而有人相心著於癡一邊則願生諸天而有眾生相心著於愛一邊則希冀長年而有壽者相有此四相尚得謂之菩薩乎妙行無住分第四奧妙之行本無住著復次須菩提菩薩於法應無所住行於布施所謂不住色布施不住聲香味觸法布施須菩提菩薩應如是布施不住於相何以故若菩薩不住相布施其福德不可思量須菩提於意云何東方虗空可思量不不也世尊須菩提南西北方四維上下虗空可思量不不也世尊須菩提菩薩無住相布施福德亦復如是不可思量須菩提菩薩但應如所教住不音否不音弗下倣此註復次謂再編次佛與須菩提問答之言也菩薩於法之法指心與身之所運用酬酢者而言住執著也布普也施散也色形像聲音樂香芬芳之氣味烹炮之品觸動也或云男女之欲亦通法者事物之則也諸法皆緣心生故屬於意講佛承上無相之義又告須菩提曰菩薩於一切心之所運用身之所酬酢者皆當無所住著而布施為尤甚何也凡夫布施往往希求利益如目之於色耳之於聲鼻之於香舌之於味身之於觸意之於法一不如其所欲則必布施以求快其所欲此住相布施也菩薩六根清淨無諸欲之求惟以法施利益一切眾生如水在地中行所無事所謂不住相布施也須菩提菩薩布施必須如是無六塵之累方為真布施方獲大利益此何故哉葢財施為凡法施為聖菩薩無住相布施毫無希冀之心縱脫生死苦受大快樂歷萬劫而不毀超三界以長存其福德雖大亦聽其自然實不可思維較量以一經思量則此心便住於相而福德反小矣夫福德固不可思量而思量亦屬無益吾試問爾東方虗空可謂大矣爾思量不須菩提曰此等虗空之處想之何用吾不思量也佛又曰南西北方四維上下虗空尤為大矣爾思量不須菩提曰此等虗空之處想之亦無用吾不思量也佛曰爾知虗空不可思量則知菩薩之無住相布施其福德亦如虗空一般斷不可思量也但須依吾之教心住於無相則自獲超證矣如理實見分第五自如之理乃見真實須菩提於意云何可以身相見如來不不也世尊不可以身相得見如來何以故如來所說身相即非身相佛告須菩提凡所有相皆是虗妄若見諸相非相即見如來註於意云何發問之詞身相謂現具之色身見猶看也非相見之見講佛謂須菩提曰汝知福德不可思量則布施當不住於相明矣豈獨布施為然哉即吾現具之形體亦非真實吾試問爾可以執四大色身遂謂如來在是不須菩提曰色身滯於官骸佛與比夫無異殆不可以身相見如來也何以故佛以法為身清清淨淨如太虗之不著形迹雖有身相而實無身相今如來所說身相是法身非色身也法身可見如來色身豈可見如來乎佛曰須菩提爾之言是也凡人所有之相皆屬虗妄虗則不實妄則不真以不實不真之相欲見如來譬若認外寇作家人終無是處若人能見諸相非相則見色身中有法身而如來在是矣正信希有分第六生正信心最為希有須菩提白佛言世尊頗有眾生得聞如是言說章句生實信不佛告須菩提莫作是說如來滅後後五百歲有持戒修福者於此章句能生信心以此為實當知是人不於一佛二佛三四五佛而種善根已於無量千萬佛所種諸善根聞是章句乃至一念生淨信者須菩提如來悉知悉見是諸眾生得如是無量福德何以故是諸眾生無復我相人相眾生相壽者相無法相亦無非法相何以故是諸眾生若心取相即為著我人眾生壽者若取法相即著我人眾生壽者何以故若取非法相即著我人眾生壽者是故不應取法不應取非法以是義故如來常說汝等比丘知我說法如筏喻者法尚應捨何況非法註如是言說章句指上數章而言五百歲約舉之詞言其遠也持戒諸惡莫作修福眾善奉行以此為實確信不疑也種善根即持戒修福之意淨信者心常清淨而為信之也如來悉知悉見心合於佛佛合於心也無法相萬法皆空無非法相外緣悉淨如來常說云者葢古佛有是語而佛復述之也筏船也喻譬也佛法濟度眾生譬以船渡人也講須菩提恐佛滅後傳法無人後來眾生未能生信故白佛曰世尊以大慈之心著希有之論座下諸比邱固莫不尊奉矣倘佛涅槃之後後來眾生得聞如是言說章句未知亦能生實信之心否佛曰須菩提性體常明心燈不滅爾莫作是說也葢此言說章句至微至妙即如來滅後至五百餘歲之遑猶有持淨戒修天福之人以此為真實妙諦而確信不疑者夫能確信於五百餘歲之後則其善根必預種於五百餘歲之前當知是人不於一佛二佛三四五佛而種善根已於無量千萬佛所種諸善根見佛多聞法多修行多也不但持戒修福者善根不可勝記即世間眾生聞是章句乃至一念之間生淨信心此心便與如來相合如親受教於如來一般如來佛慧佛眼悉知之而悉見之是諸眾生所得福德如是無量此何故哉蓋已得生法二空之妙義故也是諸眾生雖止一念淨信而此一念已無復有我相人相眾生相壽者相是生空也無法相亦無非法相是法空也生法二空其義云何葢不著相也是諸眾生若心取相即為執生便著我人眾生壽者若取法相即為執法便著我人眾生壽者若取非法相亦為執法亦著我人眾生壽者生相固不可執法與非法亦不可執如此是故持戒修福之人須令此心空空洞洞一物不有不應取法相亦不應取非法相此種義理最為微妙所以古之如來常謂大家曰爾等諸比邱知我以法度人譬如以筏濟渡人既登岸筏即無用人能了悟法亦無用矣由此觀之法尚應捨何況非法之外道乎無得無說分第七空則無得寂則無說須菩提於意云何如來得阿耨多羅三藐三菩提耶如來有所說法耶須菩提言如我解佛所說義無有定法名阿耨多羅三藐三菩提亦無有定法如來可說何以故如來所說法皆不可取不可說非法非非法所以者何一切賢聖皆以無為法而有差別差音雌註得阿耨多羅三藐三菩提耶者了却真空無定法可得也有所說法耶者因人而教無定法可說也不可取不可以色相取不可說不可以口舌說非法雖有而却無非非法雖無而却有皆以之以字作用字解講佛告須菩提曰吾教固以無上菩提為第一義然或由持戒而得之或由禪定而得之功夫不同獲效各別爾之意以為如來於無上菩提有一定之法可得耶佛門廣大固不擇人而教然智者與之言深愚者與之言淺資稟不齊施誨亦異爾之意以為如來有一定之法可說耶須菩提答曰如我解佛所說義知佛以無上菩提之義自修無一定之法可名以無上菩提之義教人亦無一定之法可說也何以故如來所說之法可以性修而不可以色相取可以心悟而不可以口舌說以為有法耶雖有而不滯於有以為無法耶雖無而不論於無此所以無一定之法可得也所以者何法本無為自古聖賢皆用無為之法誨人而淺者見淺深者見深不能不有差別此所以無一定之法可說也依法出生分第八諸佛之法依此生出須菩提於意云何若人滿三千大千世界七寶以用布施是人所得福德寧為多不須菩提言甚多世尊何以故是福德即非福德性是故如來說福德多若復有人於此經中受持乃至四句偈等為他人說其福勝彼何以故須菩提一切諸佛及諸佛阿耨多羅三藐三菩提法皆從此經出須菩提所謂佛法者即非佛法偈音忌註普天之下謂之小世界一千小世界謂之小千一千小千世界謂之中千一千中千世界謂之大千其實一大千耳斯為三千大千世界七寶琉璃玻瓈珍珠瑪瑙珊瑚金銀福德修布施之德享現在之福福德性修性中之德性彌六合其受福亦如是也四句偈當指無我相人相眾生相壽者相方有著落謂此偈不必說破者似屬空滑不可從講前言法無為矣佛意欲顯無為之福乃先與之論有盡之福因設問曰須菩提於意云何若有人於此用三千大千世界之七寶以為布施是人所得福德寧為多否須菩提曰凡人布施原欲希求利益所得福德豈有不欲其多但所得者身外之福德而非性中之福德也何以故聚寶布施不過借物而修物有限而其福德亦有限非性中之福德可比然如來猶諄諄以是人之福德為問者以彼所得雖多猶可以數計故也佛曰須菩提爾言誠然也藉物而修不若率性而修而性修之法不外此經若復有人於此經中受之不忘於心持之不厭其久乃至四句偈等為他人宣說不但覺一己之性且將覺億萬人之性其福德豈不勝彼布施之福德乎何以故葢此經乃修行之徑路凡一切諸佛及諸佛無上菩提之法皆從此出夫無上菩提之法即佛法也而佛法豈可泥乎所謂佛法者本來無有不過假此開悟眾生耳寧有真實之佛法哉一相無相分第九只此一相本自無形須菩提於意云何須陀洹能作是念我得須陀洹果不須菩提言不也世尊何以故須陀洹名為入流而無所入不入色聲香味觸法是名須陀洹須菩提於意云何斯陀含能作是念我得斯陀含果不須菩提言不也世尊何以故斯陀含名一往來而實無往來是名斯陀含須菩提於意云何阿那含能作是念我得阿那含果不須菩提言不也世尊何以故阿那含名為不來而實無不來是故名阿那含須菩提於意云何阿羅漢能作是念我得阿羅漢道不須菩提言不也世尊何以故實無有法名阿羅漢世尊若阿羅漢作是念我得阿羅漢道即為著我人眾生壽者世尊佛說我得無諍三昧人中最為第一是第一離欲阿羅漢世尊我不作是念我是離欲阿羅漢世尊我若作是念我得阿羅漢道世尊則不說須菩提是樂阿蘭那行者以須菩提實無所行而名須菩提是樂阿蘭那行洹音完那音奴註能作是念謂尚萌得道之念也前四我字乃代須陀洹等設想之詞非佛自稱也梵語須陀洹華言預流謂初人真流也梵語斯陀含華言一來謂色身一住天上一生入間也梵語阿那含華言不來謂不來受生慾界也梵語阿羅漢華言無生謂相滅生盡也無諍毫無爭競之意梵語三昧華言正見謂遠離邪見也樂好也阿蘭那即無諍也樂阿蘭那行者葢佛嘗有是語而須菩提舉以為證也講前言無為之法不可取不可說則諸菩薩修行俱當以無念為宗而不可存得果之心故佛設問曰吾教大眾修阿羅漢道者大約有四等曰須陀洹曰斯陀含曰阿那含曰阿羅漢用功不同得果亦異須菩提於意云何須陀洹當修行之時若預作得果之念便得須陀洹果否須菩提曰不也世尊何以故須陀洹得預聖人之流名為入流而心無所得不著入流之相不入色聲香味觸法之六塵境界謂之須陀洹其以是與佛曰須菩提於意云何斯陀含當修行之時若預作得果之念便得斯陀含果否須菩提曰不也世尊何以故斯陀含色身一往住天上一來生人間雖曰一往一來而心無所得不著生滅之相實無往來謂之斯陀含其以是與佛曰須菩提於意云何阿那含當修行之時若預作得果之念便得阿那含果否須菩提曰不也世尊何以故阿那含內無欲心外無欲境不來世界受生名為不來而心無所得不著不來之相謂之阿那含其以斯與佛曰須菩提於意云何阿羅漢當修行之時若預作得果之念便得阿羅漢道否須菩提曰不也世尊何以故阿羅漢萬緣悉淨無煩惱可斷無貪瞋可離無得果之心也既無得果之心即無道可得無法可名矣謂之阿羅漢其以斯與世尊若此四等之阿羅漢稍萌所得於心謂我之修行可以得阿羅漢道即著我人眾生壽者四相尚得謂之阿羅漢乎即如弟子當日會蒙我佛許過謂哉與人無競與物無忤遠離邪見得無諍三昧在大眾之中極為難得是第一離欲阿羅漢世尊所以許我為第一離欲阿羅漢者以我不存得果之念故也若我稍存得果之念謂我可以得阿羅漢道則此心便有所著世尊不應稱我為樂阿蘭那行者矣以我樂阿蘭那行而實無所行故佛深契之而以樂阿蘭那行名之也則凡欲得果者可不去其所得之心哉莊嚴淨土分第十成就莊嚴淨明心地佛告須菩提於意云何如來昔在然燈佛所於法有所得不不也世尊如來在然燈佛所於法實無所得須菩提於意云何菩薩莊嚴佛土不不也世尊何以故莊嚴佛土者即非莊嚴是名莊嚴是故須菩提諸菩薩摩訶薩應如是生清淨心不應住色生心不應住聲香味觸法生心應無所住而生其心須菩提譬如有人身如須彌山王於意云何是身為大不須菩提言甚大世尊何以故佛說非身是名大身註如來佛自稱也然燈佛釋迦牟尼授記之師一大世界必有一佛設化故曰佛土莊嚴如寫經造寺供養布施之類是故須菩提諸菩薩皆概稱也應無所住而生其心者謂心當住於無所住處也須彌山高廣三百三十六萬里為眾山之王非身法身也乃如如不動之真心講前須菩提自言所證之果既不存得心矣佛終恐其所得之心未盡故又從而點化之曰須菩提於意云何爾謂我昔日在然燈佛所受記於法有所得否須菩提曰不也世尊如來一心清淨雖在然燈佛所受記於法實無所得也佛曰一大世界必有一佛設化故謂之佛土不知菩薩居是土亦寫經造寺供養布施使佛土莊嚴否須菩提曰不也世尊莊嚴不過外相於自性無涉菩薩必不為此也何以故葢佛土即淨土也淨土不事修飾所謂莊嚴者非真莊嚴也不過虗名為莊嚴而已是故吾教之須菩提諸菩薩雖性量廣大俱應如是生清淨之心清淨云何不應住於有形色者而生心不應住於有聲音馨香滋味及觸與法而生心惟應屏絕六塵於無所住處而生其心也佛又曰須菩提譬如有人身似須彌山王爾之意以為大否須菩提曰甚大世尊但此身雖大究不定為大何以故凡有形相者皆屬有盡色身縱如須彌山王畢竟還有生滅必如佛所說之非身方可名為大身耳夫非身者法身也即真心也可以包太虗藏世界豈僅如須彌山王而已哉無為福勝分第十一修無為福勝於布施須菩提如恒河中所有沙數如是沙等恒河於意云何是諸恒河沙寧為多不須菩提言甚多世尊但諸恒河尚多無數何況其沙須菩提我今實言告汝若有善男子善女人以七寶滿爾所恒河沙數三千大千世界以用布施得福多不須菩提言甚多世尊佛告須菩提若善男子善女人於此經中乃至受持四句偈等為他人說而此福德勝前福德註恒河周四十里在西土人所共見故佛取以為喻等同也講前第八分言三千大千世界七寶以用布施不如持經佛又推廣其義而言曰須菩提恒河周四十里可謂大矣其中所有沙數難以悉計若一沙各為一河俱等於恒河之大爾之意以為此諸恒河之沙寧為多否須菩提曰甚多世尊一沙即為一河一河各有其沙河尚無數何況其沙乎佛曰須菩提我今實言告汝若有善男子善女人將七寶滿爾所說恒河沙數三千大千世界以用布施是人得福可云多否須菩提曰甚多世尊佛曰布施得福雖多究竟不若持經若善男子善女人於此經中乃至四句偈等非特受持自見其性且為他人解說使之亦見其性則彼此共證無上妙道此種福德視彼七寶布施福德豈不相懸萬萬乎尊重正教分第十二受持正教天人尊重復次須菩提隨說是經乃至四句偈等當知此處一切世間天人阿修羅皆應供養如佛塔廟何況有人盡能受持讀誦須菩提當知是人成就最上第一希有之法若是經典所在之處即為有佛若尊重弟子註隨說隨順眾生而為說法心無分別也此處即此心也世間世上之人天人天上之人阿修羅阿無也羅眾也即不修之眾生魔王等類是也殯佛之身為塔供佛之像為廟尊重弟子弟子中之可尊可重者若諸菩薩是也講上言特說福德勝於布施則經不可不說故佛又呼須菩提曰經功甚大不可思議如有善信之人隨順眾生高下逢凡說凡逢聖說聖為之講解是經乃至四句偈等多方演說當知說經一偈之處一切世間天人阿修羅皆當以香華瓔珞幢幡寶葢香油酥燈恭敬供養是人如藏佛身之塔與供佛像之廟一般何況有人盡能受持讀誦一經全文者乎須菩提當知是人所成就者為世間第一希有之法若是經所在之處便是佛在之處人皆清淨奉持即與佛無異與可尊可重之弟子諸大菩薩無異矣如法受持分第十三當如此法承受行持爾時須菩提白佛言世尊當何名此經我等云何奉持佛告須菩提是經名為金剛般若波羅蜜以是名字汝當奉持所以者何須菩提佛說般若波羅蜜即非般若波羅蜜是名般若波羅蜜須菩提於意云何如來有所說法不須菩提白佛言世尊如來無所說須菩提於意云何三千大千世界所有微塵是為多不須菩提言甚多世尊須菩提諸微塵如來說非微塵是名微塵如來說世界非世界是名世界須菩提於意云何可以三十二相見如來不不也世尊不可以三十二相得見如來何以故如來說三十二相即是非相是名三十二相須菩提若有善男子善女人以恒河沙等身命布施若復有人於此經中乃至受持四句偈等為他人說其福甚多註微塵塵中之微者譬眾生妄念之多也佛分身成化於諸世界之中示現無邊大神力使一切眾生在塵離塵在世出世故云非微塵非世界三十二相莊嚴端好指全身而言俗本謂頭如何脚如何未免太拘葢佛不一佛相不一相故也末言布施不如持經重言以結上文之意講須菩提白佛言世尊持說是經成就希有之法既聞命矣不識此經當以何命名我等云何受持乎願明以教我佛曰須菩提是經當名為金剛般若波羅蜜葢明是經者其智慧如金剛之堅利斷絕外妄直達諸佛菩薩之彼岸也以是名字汝其遵奉而持守之然真性本空無可執著智慧達彼岸之說吾性中亦豈有是哉何以故須菩提佛所說般若波羅蜜實非般若波羅蜜不過虗名為般若波羅蜜以引誘眾生耳真性本來清淨如此則知一切諸法總屬外相更有何法可說乎吾試問爾如來有所說法否須菩提曰如來萬法皆空有何可說即不得已而有說亦與無說等也佛曰須菩提於意云何三千大千世界所有微塵是為多否須菩提曰甚多世尊佛曰須菩提我今明言告汝微塵雖多而無定體世界雖大數盡則壞皆為虗妄如來所說微塵非真實微塵是虗名為微塵如來所說世界非真實世界是虗名為世界惟真性至真至實自古及今無變無壞也去真性即法相非身相也佛恐須菩提不解故又曰須菩提於意云何可以三十二相見如來否須菩提曰不也世尊不可以三十二相見如來佛曰三十二相乃現具之色身而不可以此見如來者此何故哉葢如來雖現色身涅槃則盡不能久存如來說三十二相非真實相是虗名為三十二相由斯以觀色身既屬空虗則著相布施獲福寧有幾何益信持說之福勝矣須菩提若有善男子善女人捨身命布施併恒河沙佈施俱屬著相因果何益於事若復有人於此經中乃至受持四句偈等為他人說自利利他其福甚多可見人法兩空吾前言所謂不著相布施於此益信矣離相寂滅分第十四離諸形相自得寂滅爾時須菩提聞說是經深解義趣涕淚悲泣而白佛言希有世尊佛說如是甚深經典我從昔來所得慧眼未曾得聞如是之經世尊若復有人得聞是經信心清淨即生實相當知是人成就第一希有功德世尊是實相者即是非相是故如來說名實相世尊我今得聞如是經典信解受持不足為難若當來世後五百歲其有眾生得聞是經信解受持是人即為第一希有何以故此人無我相無人相無眾生相無壽者相所以者何我相即是非相人相眾生相壽者相即是非相何以故離一切諸相即名諸佛佛告須菩提如是如是若復有人得聞是經不驚不怖不畏當知是人甚為希有何以故須菩提如來說第一波羅蜜即非第一波羅蜜是名第一波羅蜜須菩提忍辱波羅蜜如來說非忍辱波羅蜜是名忍辱波羅蜜何以故須菩提如我昔為歌利王割截身體我於爾時無我相無人相無眾生相無壽者相何以故我於往昔節節支解時若有我相人相眾生相壽者相應生瞋恨須菩提又念過去於五百世作忍辱仙人於爾所世無我相無人相無眾生相無壽者相是故須菩提菩薩應離一切相發阿耨多羅三藐三菩提心不應住色生心不應住聲香味觸法生心應生無所住心若心有住即為非住是故佛說菩薩心不應住色布施須菩提菩薩為利益一切眾生故應如是布施如來說一切諸相即是非相又說一切眾生即非眾生須菩提如來是真語者實語者如語者不誑語者不異語者須菩提如來所得法此法無實無虗須菩提若菩薩心住於法而行布施如人入暗即無所見若菩薩心不住法而行布施如人有目日光明照見種種色須菩提當來之世若有善男子善女人能於此經受持讀誦即為如來以佛智慧悉知是人悉見是人皆得成就無量無邊功德註實相法身也前屢言福德此獨言功德者葢功成果滿福不足道也波羅蜜有十種一布施二持戒三忍辱四精進五禪定六智慧七慈八悲九方便十不退今云第一波羅蜜者指布施而言也非第一波羅蜜者拂去假名不住於相也下言非忍辱波羅蜜亦是此意梵語歌利王華言無道極惡君也歌者慧也利者刀也王者心也是用慧刀斷除無明煩惱之心也割截支解等句俱係喻意不可認作實有其事應生無所住心者謂凡有住著處不得起心也此即第十分之義而推廣言之講上言受持之法爾時須菩提深解無相義趣涕淚悲泣傷值遇之晚白佛言希有世尊佛說如是甚深經典我從昔來修行雖其慧眼聞法甚多未曾有如是之妙者世尊若復有人得聞是經生篤信心湛然清淨則色身中有法身即生如來實相此人成就功德識為第一希有世尊是實相者譬若大虗所謂有相即是非相是故如來所說實相總屬鏡華水月豈真有實相之可名哉世尊我今聞是經典信而不惑解而不疑受而不辭持而不厭不足為難若當來世五百歲後其有眾生聞是經者亦能信解受持此人即為第一希有何也此人依是經修行屏除妄念不著諸相無我相無人相無眾生相無壽者相所以者何我相即是非相人相眾生相壽者相即是非相何以故葢了悟四相皆空方能離一切諸相成無上菩提名為諸佛不難矣佛曰須菩提信如爾之言也葢大乘之法非具大乘根器者聞之未免驚焉而恐懼不寧怖焉而憂疑不定畏焉而退縮不前若不驚不怖不畏諦聽受持永無退轉此人甚為希有何以故如來到彼岸之法第一曰布施次則曰忍辱如來有布施之名而不著布施之相是知如來所說第一波羅蜜即非第一波羅蜜不過假名為第一波羅蜜而已如來有忍辱之名而不著忍辱之相是知如來所說忍辱波羅蜜即非忍辱波羅蜜不過假名為忍辱波羅蜜而已由斯以觀人苟不驚不怖不畏則布施忍辱二相皆空諸相從此俱空謂為希有寧為過與即如我昔日會為歌利王割截身體若非得無相妙義則被伊節節支解時應生瞋恨心乃我則毫無瞋恨以忍辱力身復如故非惟無苦且復樂也然忍辱豈僅一世哉又念過去五百世後作忍辱仙人於爾所世雖遇外侮亦無我相人相眾生相壽者相此豈獨我然哉須菩提凡屬吾教之諸菩薩俱應離一切相發無上正等正覺心不應住於色而生心不應住於聲香味觸法而生心應生無所住之心若心有住則住非所當住即為非住而非菩薩之心矣所以古之如來甞有言曰菩薩之心莫不欲布施但眾苦之本眼根不淨為先不應住於色而為之布施也須菩提菩薩布施原為利益一切眾生若心住於色便是眼有財物則布施有時而窮故應如是無住相布施方獲真利益然心無住矣若稍存施受之念終為著相故如來常說一切諸相畢竟虗妄而非真實即是非相又說一切眾生能悟真空離眾生相即非眾生須菩提如來此語是真語而非假也是實語而非虗也是如語而當理也是非誑語而欺人也是非異語而駭聽也夫一切諸相既非真性所有則一切諸法又豈真性所有哉須菩提如來所得法為眾生而說原非真實然又不可不藉此以悟真性又非虗假有而不有無而不無真空之妙如此須菩提若菩薩之心住於法而行布施則教化眾生無由開悟如人入暗室昏昏冥冥一無所見若菩薩之心不住於法而行布施則教化眾生皆得開悟如人有目又得日光明照種種諸色無不畢見夫真空無相莫如此經須菩提當來之世若有善男子善女人能於此經受持讀誦非但為口耳之功抑亦究心學之妙即為如來所眷顧用無上智慧知見是人而照鑒之不但利於一身且將普於羣生不但利於一時且將及於千萬億劫而無量無邊功德皆得成就矣持經功德分第十五受持此經功德無量須菩提若有善男子善女人初日分以恒河沙等身布施中日分復以恒河沙等身布施後日分亦以恒河沙等身布施如是無量百千萬億劫以身布施若復有人聞此經典信心不逆其福勝彼何況書寫受持讀誦為人解說須菩提以要言之是經有不可思議不可稱量無邊功德如來為發大乘者說為發最上乘者說若有人能受持讀誦廣為人說如來悉知是人悉見是人皆得成就不可量不可稱無有邊不可思議功德如是人等即為荷擔如來阿耨多羅三藐三菩提何以故須菩提若樂小法者著我見人見眾生見壽者見即於此經不能聽受讀誦為人解說須菩提在在處處若有此經一切世間天人阿修羅所應供養當知此處即為是塔皆應恭敬作禮圍遶以諸華香而散其處註信心不逆者生篤信心不相違背也乘車也阿羅漢獨了生死不度眾生謂之小乘緣覺之人半為人半為己謂之中乘菩薩普度一切謂之大乘發猶啟也最上乘者兼菩薩而載度之佛乘也荷擔仔肩之意樂好也小法外道也諸華香即法華經所載未利青蓮白蓮等香是也講佛恐世人執忍辱之說徒以身布施墮入貪癡障中故呼須菩提曰若有善男子善女人初日分寅卯辰時以恒河沙等身命布施中日分巳午未時復以恒河沙等身命布施後日分申酉戌時亦以恒河沙等身命布施如是一日三分歷無量百千萬億劫以身行布施世間所斷無之事即有之亦不過得世間福耳若復有人聞是經典信之於心順而不逆其所得之福尚勝於彼何況更能書寫受持讀誦為人解說者乎須菩提要而言之此經不可以心思不可以口議不可以器物稱量功德廣大無有邊際然非遇發大乘心發最上乘心者如來斷不與之說也若果有人受持讀誦逢凡說凡逢聖說聖廣為闡發便後學各見性中無相之理則是人心即是佛佛即是心如來佛智佛慧悉知之悉見之皆得成就不可量不可稱無有邊不可思議功德如來無上菩提不難以一身荷擔之矣豈樂小法者所可同日語哉葢樂小法之人迷於外道恒著我見人見眾生見壽者見即於此經不能聽受讀誦為人解說不知此經普度一切至微至妙須菩提在在虗處有此經典便如摩尼寶珠瑞光燦爛一切世間凡在天道人道阿修羅道者莫不至心供養當知此處與藏佛真身舍利寶塔一般皆應恭敬作禮圍遶以諸華香而散其處所謂一人辨心諸天辦供者此類是也能淨業障分第十六若能清淨業障盡消復次須菩提若善男子善女人受持讀誦此經若為人輕賤是人先世罪業應墮惡道以今世人輕賤故先世罪業即為消滅當得阿耨多羅三藐三菩提須菩提我念過去無量阿僧祗劫於燃燈佛前得值八百四千萬億那由他諸佛悉皆供養承事無空過者若復有人於後末世能受持讀誦此經所得功德於我所供養諸佛功德百分不及一千萬億分乃至算數譬喻所不能及須菩提若善男子善女人於後末世有受持讀誦此經所得功德我若具說者或有人聞心即狂亂狐疑不信須菩提當知是經義不可思議果報亦不可思議註輕賤謂疾病貧窮諸衰相為人所憎惡也惡道地獄餓鬼畜生也梵語阿僧祗華言無央數梵語那由他華言一萬萬具說詳言也講持誦此經宜為天人恭敬供養而往往不免人之輕賤鮮不以持誦為無益矣故佛曰須菩提若善男子善女人受持讀誦此經反為人所輕賤是人生前罪業深重當墮地獄餓鬼畜生三惡道中以今生持誦之功故祇為人輕賤而已前生罪業即為消滅來世無上正等正覺佛果當得成就須菩提即如我往日曾歷無量無央數劫於燃燈佛前得遇八百四千萬億那由他諸佛悉皆供養承事無空過者然祇求福而已不能出離苦海若復有人於後末世能受持讀誦此經自悟本性永脫輪迴其所得功德以我所供養諸佛功德較之百分不能及其一分極而千萬億分乃至算數之多譬如微塵恒沙皆不能及葢供養為財施受財施之報者日漸少而終至於有盡持誦為法施受法施之報者日益增而終至於成佛然則此經豈人所易聞者乎須菩提若善男子善女人於後末世有受持讀誦此經者其所得功德我若詳言其妙下根之人聞之甚者心即狂亂次者狐疑不信皆以我言為夸而驚怪矣須菩提當知此經之義趣與功德之果報皆不可以心思而日議我又何庸具說為哉究竟無我分第十七成佛究竟本無我相爾時須菩提白佛言世尊善男子善女人發阿耨多羅三藐三菩提心云何應住云何降伏其心佛告須菩提善男子善女人發阿耨多羅三藐三菩提心者當生如是心我應滅度一切眾生滅度一切眾生已而無有一眾生實滅度者何以故須菩提若菩薩有我相人相眾生相壽者相即非菩薩所以者何須菩提實無有法發阿耨多羅三藐三菩提心者須菩提於意云何如來於燃燈佛所有法得阿耨多羅三藐三菩提不不也世尊如我解佛所說義佛於燃燈佛所無有法得阿耨多羅三藐三菩提佛言如是如是須菩提實無有法如來得阿耨多羅三藐三菩提須菩提若有法如來得阿耨多羅三藐三菩提者燃燈佛即不與我授記汝於來世當得作佛號釋迦牟尼以實無有法得阿耨多羅三藐三菩提是故燃燈佛與我授記作是言汝於來世當得作佛號釋迦牟尼何以故如來者即諸法如義若有人言如來得阿耨多羅三藐三菩提須菩提實無有法佛得阿耨多羅三藐三菩提須菩提如來所得阿耨多羅三藐三菩提於是中無實無虗是故如來說一切法皆是佛法須菩提所言一切法者即非一切法是故名一切法須菩提譬如人身長大須菩提言世尊如來說人身長大即為非大身是名大身須菩提菩薩亦如是若作是言我當滅度無量眾生即不名菩薩何以故須菩提實無有法名為菩薩是故佛說一切法無我無人無眾生無壽者須菩提若菩薩作是言我當莊嚴佛土是不名菩薩何以故如來說莊嚴佛土者即非莊嚴是名莊嚴須菩提若菩薩通達無我法者如來說名真是菩薩註梵語釋迦華言能仁梵語牟尼華言寂默也由爾時以下至實無有法發阿耨多羅三藐三菩提句雖與第三分相似但第三分言滅度一切在生如是心此言生如是心亦非真實語同而意有淺深由於燃燈佛所以下至無實無虗句雖與第七分第十四分相似但第七分言無有定法尚有法在此言實無有法則併法俱空矣第十四分不著四相專指布施忍辱而言此則兼一切而言也較前更覺精深濶大由是故如來說一切法句以下至末雖與第十分相似但第十分非莊嚴非大身等語虗論其理此言通達無我法便可直登彼岸兼論其效更得引誘後學之意講此經既不可以心思而口議則受持讀誦不容己矣爾時須菩提白佛言世尊善男子善女人發無上正等正覺心者此心當住於何處方能降伏其妄念乎佛告須菩提善男子善女人發無上正等正覺心者當生如是超證一切眾生心舉一切眾生皆消滅其妄想而度化之滅度一切眾生盡已成佛而無有一眾生實滅度者良由眾生自滅自度我無功也所以然者何也葢存滅度之念即為著相若菩薩之心一著於相即有我人眾生壽者之見而即非菩薩矣夫無相可著則無法可名不但塵緣外感盡屬空虗即所謂發無上正等正覺心者亦吾性中自具豈是循途守轍依於法而後然哉吾試問爾我昔日在燃燈佛所多蒙授記得無上菩提爾謂有一定之法否須菩提曰不也世尊如我解佛所說義空諸一切則知於燃燈佛所無有法得無上菩提也佛深以其言為然曰如是如是須菩提實無有法如來得無上菩提若如來得無上菩提果有一定之法燃燈佛即不與我授記當即傳以成佛之法矣何待沾沾然向我言曰汝於來世當得作佛號釋迦牟尼乎惟實無有法得無上菩提故燃燈佛與我授記作是言謂汝於來世當得作佛號釋迦牟尼云云也夫記乃如來得果之妙諦而如來者即真性也真性貫徹三世綿亘十方即諸法皆得自如之義豈有定法之可名哉若有人言如來得無上菩提必有定法此皆妄語而不足信也庸詎知如來得無上菩提皆由積功累行之久具心領神會之妙萬緣淨而諸相空實無有法可得然無法可得而又不可謂非得得而無得之中實而不實虗而不虗所以如來常說一切諸法皆是用之以修行而成佛之法也夫用以修行即虗而不虗也而成佛初不在是即實而不實也此豈可泥乎須菩提如來所言一切法非真實一切法不過假此修行虗名為一切法耳此義可借喻而知之矣須菩提譬如人身長大果真實否須菩提曰世尊如來說人身長大然有生滅有限量非真實大身不過虗名為大身而已佛曰須菩提菩薩教化眾生非為真實亦如大身之不真實若菩薩作是言謂無量眾生皆由我而滅度之知此見識是成佛有法矣尚得名之為菩薩乎何以故葢真性空空洞洞非雅無法併菩薩之名亦屬虗假實無有法名為菩薩是故佛說一切諸法無我人眾生壽者既無四者又安得有所謂菩薩乎至於離相以度眾生使一切世界皆為清淨正是真莊嚴處若菩薩不於此是求反曰我當以金珠等寶莊嚴世間佛土值凡夫之見耳不得名為菩薩何以故如來說莊嚴佛土者不過外飾之莊嚴非真莊嚴但強名為莊嚴而已夫起度化心著莊嚴相不得名為菩薩畢竟發何等心方得名為菩薩乎必也四通八達深明無我之法遠離一切諸相人法兩忘則度化之心與莊嚴之心俱不起矣故如來說名真是菩薩一體同觀分第十八萬法歸一更無異觀須菩提於意云何如來有肉眼不如是世尊如來有肉眼須菩提於意云何如來有天眼不如是世尊如來有天眼須菩提於意云何如來有慧眼不如是世尊如來有慧眼須菩提於意云何如來有法眼不如是世尊如來有法眼須菩提於意云何如來有佛眼不如是世尊如來有佛眼須菩提於意云何如恒河中所有沙佛說是沙不如是世尊如來說是沙須菩提於意云何如一恒河中所有沙有如是沙等恒河是諸恒河所有沙數佛世界如是寧為多不甚多世尊佛告須菩提爾所國土中所有眾生若干種心如來悉知何以故如來說諸心皆為非心是名為心所以者何須菩提過去心不可得現在心不可得未來心不可得註見眾生形色名曰肉眼見大千世界名曰天眼見自性般若名曰慧眼見一切法無一切法名曰法眼無自性可守無諸佛可求放大光明破諸黑暗名曰佛眼如是世尊既然而復稱之也若如也干數也謂眾生之心種種有差別也非心妄想之心也是名為心不起妄想即是本心也過去現在未來謂之三世不可得猶言不可有也講上言通達無我法而後可名為菩薩然真空之中自有實見故佛曰須菩提於意云何如來有觀見眾生之肉眼否須菩提曰如是世尊如來有肉眼佛曰須菩提於意云何如來有普照世界之天眼否須菩提曰如是世尊如來有天眼佛曰須菩提於意云何如來有返觀內照之慧眼否須菩提曰如是世尊如來有慧眼佛曰須菩提於意云何如來有見諸法皆空之法眼否須菩提曰如是世尊如來有法眼佛曰須菩提於意云何如來有真性常昭上自諸天下至九幽毫無障礙之佛眼否須菩提曰如是世尊如來有佛眼佛既具此五眼則所知極廣豈有不能覺一切眾生之心乎故佛又曰須菩提於意云何如恒河中所有之沙佛說是沙否須菩提曰如是世尊如來說是沙佛曰須菩提於意云何如一恒河中所有之沙分之各為一恒河而諸恒河中所有之沙分之各為佛世界佛世界如是寧為多否須菩提曰甚多世尊佛曰須菩提彼佛世界雖多所有一切眾生若干種心總名妄心如來悉能知之誠以性體光明無不徧照也無不徧照者常住之真心歷萬劫而不變者也何以故如來說一切諸心總屬虗假皆為非心若識諸心非心是名為心又安有過去現在未來之妄想哉所以者何須菩提凡思念前事為過去心思念今事為現在心思念後事為未來心此三種心本來無有乃因事而生今真心常住則萬法背空三種心於何而有哉法界通化分第十九法身徧界通化無邊須菩提於意云何若有人滿三千大千世界七寶以用布施是人以是因緣得福多不如是世尊此人以是因緣得福甚多須菩提若福德有實如來不說得福德多以福德無故如來說得福德多註因緣即因由也福德有實者只福德為有而妄生希冀也福德無故者以福德為無而不著一切相也此與第八分相似但第八分言七寶布施不如持經是望人藉經行布施此言七寶布施福德有限是望人離相行佈施較第八分更覺空濶講心有所著即為非心可見福德不宜執著而生希望矣故佛曰須菩提於意云何若有人滿三千大千世界七寶以用布施是人以是布施因緣得福多否須菩提曰如是世尊是人以是因緣得福甚多佛曰修因得果報應之常七寶布施得福甚多理固然也但下乘之人以福德為有藉布施以乘遂其私此為妄心福德雖多終屬小果未免有盡故如來不說得福德多惟大慧之人以福德為無藉布施以修己之性此為佛心所得福德譬如虗空無有邊界故如來說得福德多也豈彼著相布施所可同日而語哉離色離相分第二十色相皆妄離妄見性須菩提於意云何佛可以具足色身見不不也世尊如來不應以具足色身見何以故如來說具足色身即非具足色身是名具足色身須菩提於意云何如來可以具足諸相見不不也世尊如來不應以具足諸相見何以故如來諸相具足即非具足是名諸相具足註具足毫無虧欠也色身三十二相也具足諸相變化神通不止三十二相而已也此與第五分第十三分相似但第五分言凡所有相皆是虗妄是欲人於有相之如來見無相之如來此言具足色身又云具足諸相是欲人於神妙不測之如來見真性一定之如來第十三分言與其見如來三十二相之假不如持經之真是引人持經此言不但三十二相是假即變化神通亦非真也是極贊如來語同而意自別講前言諸佛所證乃無為福德又何身相之可見乎故佛曰須菩提於意云何可以三十二相具足之色身見佛否須菩提曰不也世尊一切色身皆為虗假不應以此見佛也何以故如來說具足色身即非具足色身惟真性無變無壞方可名為具足色身佛曰須菩提於意云何具足色身既不可以見如來可以變現神通具足之諸相見如來否須菩提曰不也世尊色身諸屬虗假諸相亦非真實亦不應以此見如來也何以故如來說諸相具足即非具足惟真性靜涵萬有方可名為諸相具足總之身相華也真性實也欲見如來奈何不求之於其實而徒求之於事華哉非說所說分第二十一法無可說所說非法須菩提汝勿謂如來作是念我當有所說法莫作是念何以故若人言如來有所說法即為謗佛不能解我所說故須菩提說法者無法可說是名說法爾時慧命須菩提白佛言世尊頗有眾生於未來世聞說是法生信心不佛言須菩提彼非眾生非不眾生何以故須菩提眾生眾生者如來說非眾生是名眾生註莫作是念者教須菩提不可存此念也慧以德言命以壽言即長老之稱此分前半與第七分如來無所說之義相似後半與第十四分一切眾生即非眾生之義相似但第七分乃須菩提自作答語此則就須菩提所已明者而復進之也第十四分言之略此則言之詳也講色身諸相既不足以見如來則為人說法又豈足以見如來乎故佛曰須菩提汝見如來日與眾生講解遂謂如來有法可說耶汝莫作是念也何以故葢明真性者則無法可說若人言如來有所說法是謂如來不明真性即為謗佛良由不能解我所說法空之義故也須菩提所謂說法者不過為眾生為除外妄不得已而有說耳若眾生既悟則此法應捨實無可說但虗名為說法而已爾時長老須菩提心開意解白佛言世尊頗有眾生於未來世聞說是法生信心否佛曰須菩提彼具真一之性與佛同源非眾生也然現具眾生之相又不可謂非眾生何以故眾生眾生者如來說非真實眾生但虗名為眾生而已若眾生能生信心了悟真性亦即是佛又安有眾生之名哉無法可得分第二十二悟性空故無法可得須菩提白佛言世尊佛得阿耨多羅三藐三菩提為無所得耶佛言如是如是須菩提我於阿耨多羅三藐三菩提乃至無有少法可得是名阿耨多羅三藐三菩提註上言無法可說即無法可得此言真性清淨空虗不但無法可得並無上菩提之名亦屬虗假較第七分之義更深講須菩提聞佛無法可說之義恍然有悟白佛言世尊有法可得是名法縛無法可得方謂解脫今佛得無上菩提於法殆無所得耶佛深以其言為然曰如是如是須菩提我於無上菩提毫不著稍乃至無有少法可得亦併無名可名但虗名為無上菩提而已葢萬法皆空故得而無得也淨心行善分第二十三以清淨心行諸善法復次須菩提是法平等無有高下是名阿耨多羅三藐三菩提以無我無人無眾生無壽者修一切善法即得阿耨多羅三藐三菩提須菩提所言善法者如來說即非善法是名善法註是法指真性而言平等佛與眾生無高下也修一切善法謂常行方便隨順眾生而為說法令悟真性也講如來無少法可得則諸相皆空尚安有人己之見哉故呼須菩提曰人皆以佛為高以眾生為下不知法皆平等上自諸佛下至螻蟻皆含真性無所分別葢色身有高下而真性無高下是以名為無上菩提也然所以名為無上菩提者以真性中本無我人眾生壽者故也若能悟此四相皆空而修一切善法則得無上菩提不難矣然一切善法佛不過借此以開悟眾生耳究竟本來無是也須菩提所言善法者如來說即非善法是虗名為善法而已善法者真性也真性豈可謂之法哉真性我所本有又豈可謂之得哉福智無比分第二十四福智甚大無物可比須菩提若三千大千世界中所有諸須彌山王如是等七寶聚有人持用布施若人以此般若波羅蜜經乃至四句偈等受持讀誦為他人說於前福德百分不及一百千萬億分乃至算數譬喻所不能及註此分之義第八分言之第十一分第十九分言之至此又言之但第八分言聚寶布施不如持說重在持說此言持說福德勝於布施重在福德第十一分以恒河沙譬極言福德之多此以須彌山王譬極言福德之大第十九分歸重福德無故言福德亦屬虗假興此毫不相複總之後十數分與前十數分語同而意別者甚多世人不察謂如來為續到者重言之不知如來敷宣妙義著而為經諸大弟子皆可按簡尋求何必為續到者覆說一遍乎且此經為阿難尊者所記若有複語自應刪去豈有重為敘入之理講前言修一切善法即得無上菩提則持說福德寧有限乎故呼須菩提曰大世界中所有須彌山王若有人聚三千大千世界之七寶如須彌山王之高持以佈施其福德似不可量矣然非性中之福德也若人以此般若波羅蜜經乃至四句偈等受持讀誦為他人說是修自性福德聚自身七寶不但自利亦且利他如此無量福德以前七寶布施之福德較之百分不能及其一分極而至於百千萬億分乃至算數之多譬如微塵恒沙皆不能及也葢世間福有時而盡出世間福無時而窮豈可相提而並論哉化無所化分第二十五聖凡同性化無所化須菩提於意云何汝等勿謂如來作是念我當度眾生須菩提莫作是念何以故實無有眾生如來度者若有眾生如來度者如來即有我人眾生壽者須菩提如來說有我者即非有我而凡夫之人以為有我須菩提凡夫者如來說即非凡夫是名凡夫註此與第三分第十七分相似但第三分言滅度眾生如來不居其功第十七分言滅度眾生如來實無有法此言眾生本非凡夫所以能自滅度語句雖同各有精義講持說有無量福德則此經洵能滅度一切矣然與如來無與也故呼須菩提曰於意云何汝等勿謂如來作是念我當以此經度眾生汝莫作是念也何以故葢眾生自滅自度如來不過為之指示出頭路耳實無有眾生為如來度者若有眾生為如來度者如來即有我人眾生壽者四相矣如來既無四相因何有時而稱我須菩提當知如來說有我者乃對凡夫而言所謂有我者即非有我而凡夫之人以為如來有我耳然佛此性凡夫亦此性佛與凡夫寧有異乎須菩提凡夫者如來說即非凡夫是名凡夫葢凡夫能悟自性便是如來不過虗名為凡夫而已豈有真實之凡夫哉法身非相分第二十六清淨法身非屬相貌須菩提於意云何可以三十二相觀如來不須菩提言如是如是以三十二相觀如來佛言須菩提若以三十二相觀如來者轉輪聖王即是如來須菩提白佛言世尊如我解佛所說義不應以三十二相觀如來爾時世尊而說偈言若以色見我以音聲求我是人行邪道不能見如來註轉輪聖王即四大天王管四部州如車輪之轉邪道外道也此與第五分第十三分相似但前二分乃須菩提已悟三十二相不可以見如來之旨自作註語此則佛恐須菩提執相之見未除故就其已悟者而復申明之也講真性中既無佛與凡夫之別則相之不可執也明矣故佛呼須菩提曰於意云何可以三十二相觀如來否須菩提疑佛與凡夫既無異性則凡夫有身佛亦有身故答曰如是如是可以三十二相觀如來佛曰三十二相外貌也非真性也若以此觀如來則色身莊嚴者莫如轉輪聖王彼亦可謂之如來矣如來恐不在此區區外貌間也須菩提疑心頓釋白佛言世尊如我解佛所說義則知色身有盡法身無窮不應以三十二相觀如來有斷然矣佛於是迎其機而作偈曰如來者真性也真性即我也視之不見以形色相見不可也聽之不聞以音聲相求不可也若見我求我於形色音聲之間是人徒觀外貌而不識真性則所行者邪道豈能見常住之如來聞無上之妙義哉無斷無滅分第二十七依法修持不應斷滅須菩提汝若作是念如來不以具足相故得阿耨多羅三藐三菩提須菩提莫作是念如來不以具足相故得阿耨多羅三藐三菩提須菩提汝若作是念發阿耨多羅三藐三菩提心者說諸法斷滅莫作是念何以故發阿耨多羅三藐三菩提心者於法不說斷滅相註諸法斷滅者謂一切法皆不用也於法不說斷滅相者謂未悟時必須依佛法修行也此分凡二段前段是寶後段是主前段首句不以具足相故不字係衍文古本皆無此字講如來常言無法可說又恐人執著無字流入空寂故呼須菩提曰汝若作是念謂如來以具足相故得無上菩提是以有相視如來汝莫作是念也葢如來之無上菩提不以具足相而得者也然萬法雖空而修行有徑法又豈可斷滅乎須菩提汝若作是念謂發無上菩提心者說一切法皆當斷滅是以空寂視如來汝莫作是念也何以故葢發無上菩提心者於一切法相不說斷滅故也譬如渡水既渡之後不須舟楫未渡之先豈可無舟楫乎不受不貪分第二十八一塵不染何貪何受須菩提若菩薩以滿恒河沙等世界七寶持用佈施若復有人知一切法無我得成於忍此菩薩勝前菩薩所得功德何以故須菩提以諸菩薩不受福德故須菩提白佛言世尊云何菩薩不受福德須菩提菩薩所作福德不應貪著是故說不受福德註聚寶佈施福德有限前屢言之俱是虗論其理此則示以下手工夫使學者有所遵循不致浮空掠影講法固不可斷滅若欲受福德又未免食著故呼須菩提曰若菩薩以滿恒河沙等世界之七寶持以佈施福德終屬有盡若復有人知一切法本來無有我相忍之於六塵未接之先忍之於六塵方接之際忍之於六塵既寂之後忍之又忍至於成佛而後已此菩薩所得功德勝前七寶布施之菩薩所得功德何以故須菩提以諸菩薩之心活潑潑地洞若太虗不受世間一切福德故也爾時須菩提得聞妙義白佛言世尊菩薩濟渡眾生原為希求福德今反云不受何也佛曰須菩提菩薩本不為作福德而度眾生此心不應少有貪著是故說不受福德究之不受福德而福德隨之有不期然而然者已威儀寂淨分第二十九真性寂淨不假威儀須菩提若有人言如來若來若去若坐若臥是人不解我所說義何以故如來者無所從來亦無所去故名如來註若來若去猶云若住若行無所來無所去二句形容贊歎之詞三如來俱指真性而言講菩薩之心既不求福德則諸相皆空尚何威儀之外著乎故佛曰須菩提來去坐臥謂之四威儀若有人言如來若來若去若坐若臥是以有相視如來而於我所說無相之義殊未解也何以故所謂如來者即真性也真性放之彌於六合無所從來斂之藏於一心亦無所從去去來皆得自如方可名為如來既無來去自無坐臥葢空空洞洞而威儀寂淨也一合理相分第三十一合之理實無有相須菩提若善男子善女人以三千大千世界碎為微塵於意云何是微塵眾寧為多不須菩提言甚多世尊何以故若是微塵眾實有者佛即不說是微塵眾所以者何佛說微塵眾即非微塵眾是名微塵眾世尊如來所說三千大千世界即非世界是名世界何以故若世界實有者即是一合相如來說一合相即非一合相是名一合相須菩提一合相者即是不可說但凡夫之人貪著其事註微塵妄念也眾猶多也一合相真性也貪著依戀也事即色身中六根也講凡夫妄念紛紜不可勝計故佛借喻曰須菩提若善男子善女人以三千大千世界碎為微塵爾之意以為是微塵眾寧為多否須菩提曰甚多世尊何以故若是微塵眾是實有者佛即不說是微塵眾所以不說者何故葢佛說微塵眾即非微塵眾是虗名為微塵眾而已知微塵眾非真實則知世界矣世尊如來所說三千大千世界亦非實有不過末劫之人強名為世界耳何以故若世界是實有者即與一合相無異矣一合相者真性也真性彌淪六合有而非有無而非無故一而不可二合而不可分也若世界則是假合劫盡則壞故不可與真性相比也然所謂一合相豈果有相乎如來說一合相即非一合相亦虗名而已豈真有一合相哉佛曰須菩提一合相者包涵萬有是誠不可以言說也所以不可說者因凡庸之夫貪著性中所現之事如目遇色則為色引耳聞聲則為聲誘六根不淨了悟無期即與之說彼亦不解故不如不說之為愈也知見不生分第三十一如是知見法相不生須菩提若人言佛說我見人見眾生見壽者見須菩提於意云何是人解我所說義不不也世尊是人不解如來所說義何以故世尊說我見人見眾生見壽者見即非我見人見眾生見壽者見是名我見人見眾生見壽者見須菩提發阿耨多羅三藐三菩提心者於一切法應如是知如是見如是信解不生法相須菩提所言法相者如來說即非法相是名法相註如來言不著四相之見屢矣始則令諸學人除去粗重四相如大乘正宗分中所說是也次則令諸學人見性之後復除細微四相如究竟無我分中所說是也此言理中清淨四相由淺而深循循善誘所以開悟學人者至矣講凡夫貪著其事以有我人眾生壽者之見也故呼須菩提曰諸相皆空者佛也苦有人言佛尚說我見人見眾生見壽者見此等妄議之人汝之意以為是人解我所說無相之義否須菩提曰不也世尊妄議之人墮於癡迷不解如來所說義何以故葢此四相之見真性中本來無有世尊說我見人見眾生見壽者見即非我見人見眾生見壽者見是虗名為我見人見眾生見壽者見而已須菩提悟佛不著四相之見則知見廣而信解深矣故佛又曰須菩提四見既屬空虗則發無上菩提心者凡於一切法皆應如是知如是見應如是信解而後人已胥忘畛域俱化不生一切法相須菩提所謂法相者如來說非真實是虗名而已葢初入道時不假法相無門可九既見性後當離法相不宜執著所謂波河當用筏到岸不須船者也應化非真分第三十二應現設化亦非真實須菩提若有人以滿無量阿僧祇世界七寶持用布施若有善男子善女人發菩提心者持於此經乃至四句偈等受持讀誦為人演說其福勝彼云何為人演說不取於相如如不動何以故一切有為法如夢幻泡影如露亦如電應作如是觀佛說是經已長老須菩提及諸比邱比邱尼優婆塞優婆夷一切世間天人阿修羅聞佛所說皆大歡喜信受奉行註如如者自如之極也有為法布施等類是也夢幻泡影露電皆不長久者也全經大旨無非欲人由法相而悟真空持說之功勝於聚寶佈施故於篇末重言以結之男僧謂之比邱女僧謂之比邱尼居士謂之優婆塞道姑謂之優婆夷講上言發無上菩提心者在不生一切法相然則無上菩提於何而得哉則莫若持說此經故終呼須菩提而告之曰若有人以滿無量無央數世界之七寶持以佈施其所得之福可謂多矣然所得乃世間之福有時而盡況因受福而又作惡乎若有善男子善女人發菩提心於此經中乃至四句偈等受持讀誦為人演說此出世間福歷劫無窮殊勝於彼也云何謂人演說如欲為天人演說則現而為天人欲為異類演說則現而為異類隨感而應不拘定相自如之極而實寂然不動此所謂無為法也何以故凡一切法皆屬有為縱得世間福不過如夢耳幻耳泡耳影耳露耳電耳應作如是等觀而不得長久也惟知萬法皆空悟真性為實則智慧生而到彼岸不難矣前所謂應如是住者正住此如如不動之真心也如是降伏者正降伏此有為之妄心也全經大義不於此而益明哉佛說是經已畢長老須菩提及一切大眾聞此妙義盡生歡喜敬信承受而奉行不怠焉葢聖凡悉濟而人天胥度云閻羅天子敕取藏中補闕真言唵呼嚧呼嚧社曳穆契莎音梭訶補闕真言南無喝囉怛那哆囉夜耶佉囉佉囉俱住俱住摩囉摩囉虎囉吽賀賀蘇怛拏吽潑抹拏娑婆訶讚金剛般若功德難宣四句妙義廣無邊須菩提信力堅無說無傳應作如是觀南無祇園會上佛菩薩三稱
